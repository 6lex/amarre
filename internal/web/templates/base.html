{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amarre</title>
<style>
:root{--ground:#F5F7F7;--surface:#fff;--surface-2:#EFF3F3;--ink:#111A1C;--ink-2:#43555A;
--ink-3:#7B8D91;--border:#DBE3E4;--accent:#0E7C86;--accent-soft:#E2F0F1;
--ok:#2C7A4B;--ok-s:#E4F1E9;--warn:#9A6206;--warn-s:#F8EEDC;--crit:#AC2318;--crit-s:#FAE7E5;
--mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--ground:#0C1113;--surface:#141B1D;--surface-2:#1B2426;
--ink:#E7EDEE;--ink-2:#A9BABE;--ink-3:#78898D;--border:#232F32;--accent:#40B3BC;--accent-soft:#10353A;
--ok:#54B37B;--ok-s:#12301F;--warn:#D19A31;--warn-s:#33260D;--crit:#E4695D;--crit-s:#3A1614}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans);
-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
h1{font-size:19px;margin:0;letter-spacing:-.01em}
.sp{flex:1}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.card-h{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center}
.card-h h2{font-size:13.5px;margin:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;font-size:10.5px;font-weight:600;letter-spacing:.09em;
text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--surface-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
td.host{font-family:var(--mono);font-size:12.5px;position:relative;padding-left:20px}
td.host::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ok)}
tr.s-overdue td.host::before,tr.s-nobackup td.host::before{background:var(--crit)}
tr.s-unknown td.host::before{background:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;
font-size:11px;font-weight:600}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-s);color:var(--ok)}
.p-warn{background:var(--warn-s);color:var(--warn)}
.p-crit{background:var(--crit-s);color:var(--crit)}
.btn{padding:7px 13px;border-radius:7px;border:1px solid var(--border);background:var(--surface);
color:var(--ink);font:600 12.5px var(--sans);cursor:pointer}
.btn:hover{background:var(--surface-2)}
a{color:var(--accent)}
form.login{max-width:340px;margin:12vh auto;background:var(--surface);border:1px solid var(--border);
border-radius:10px;padding:26px}
form.login h1{margin-bottom:4px}
form.login p.sub{color:var(--ink-3);font-size:12.5px;margin:0 0 20px}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
color:var(--ink-3);margin:14px 0 5px}
input{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;
background:var(--ground);color:var(--ink);font:14px var(--mono)}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.err{background:var(--crit-s);color:var(--crit);border:1px solid var(--crit);border-radius:7px;
padding:9px 11px;font-size:12.5px;margin-top:14px}
.full{width:100%;margin-top:20px;background:var(--accent);border-color:var(--accent);color:#fff}
.muted{color:var(--ink-3);font-size:12px}
</style>
{{end}}
